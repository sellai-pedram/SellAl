<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest">
<title>SellAI — AI فروش</title>
<style>
body{font-family:system-ui;background:#0b1020;color:#fff;margin:0}.wrap{max-width:720px;margin:auto;padding:18px}
.card{background:#151c30;border:1px solid #27314c;border-radius:18px;padding:18px;margin:14px 0}
input,button,select{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #35415f;background:#0e1527;color:#fff;margin:6px 0}
button{cursor:pointer;background:#6d5dfc;border:0;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#aab4cc}.hide{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#26304b}
img.preview{width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:#0b1020}
pre{white-space:pre-wrap;line-height:1.8}.qr{width:220px;height:220px;background:#fff;padding:8px;border-radius:10px;display:block;margin:10px auto}
h1{margin-bottom:4px}
</style></head><body><div class="wrap">
<h1>SellAI ✨</h1><div class="muted">تولید محتوای فروش از روی عکس محصول</div>
<div class="card" id="auth"><h3>ورود / ثبت‌نام</h3><input id="email" placeholder="ایمیل"><input id="pass" type="password" placeholder="رمز عبور">
<div class="row"><button onclick="auth('/login')">ورود</button><button onclick="auth('/register')">ثبت‌نام</button></div><div id="msg" class="muted"></div></div>
<div id="app" class="hide">
<div class="card"><div>وضعیت: <span id="plan" class="pill"></span></div><div id="credits" class="muted"></div></div>
<div class="card"><h3>ساخت محتوا</h3><input id="photo" type="file" accept="image/*"><select id="lang"><option value="fa">فارسی</option><option value="en">English</option></select><button onclick="generate()">Generate ✨</button><img id="preview" class="preview hide"><pre id="result"></pre></div>
<div class="card"><h3>Pro — ۵ USDT / ۳۰ روز</h3><div class="muted">پرداخت USDT روی شبکه TRON (TRC20)</div><button onclick="order()">ساخت فاکتور پرداخت</button><div id="pay"></div></div>
</div></div>
<script>
let token=localStorage.getItem('sellai_token');
const $=id=>document.getElementById(id);
async function api(url,opt={}){
  try{
    let r=await fetch(url,{headers:{'Accept':'application/json','Content-Type':'application/json',...(opt.headers||{})},...opt});
    let text=await r.text();
    let j={};
    try{j=JSON.parse(text)}catch(_){j={detail:text||('HTTP '+r.status)}}
    if(!r.ok)throw Error(j.detail||('HTTP '+r.status));
    return j;
  }catch(e){
    if(e instanceof TypeError) throw Error('ارتباط با سرور برقرار نشد؛ چند ثانیه بعد دوباره تلاش کن.');
    throw e;
  }
}
async function auth(url){try{let j=await api(url,{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value})});token=j.token;localStorage.setItem('sellai_token',token);boot()}catch(e){$('msg').textContent=e.message}}
async function boot(){if(!token)return;$('auth').classList.add('hide');$('app').classList.remove('hide');let m=await api('/me?token='+encodeURIComponent(token));$('plan').textContent=m.plan==='pro'?'PRO':'FREE';$('credits').textContent='اعتبار رایگان: '+m.credits+(m.pro_until?' | Pro تا: '+m.pro_until:'')}
$('photo').onchange=()=>{let f=$('photo').files[0];if(!f)return;$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hide')}
async function dataUrl(f){
  // Compress the image in the browser before sending it. This keeps mobile uploads
  // small enough for the free Render instance and avoids failed large requests.
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('خواندن عکس ناموفق بود'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('فرمت عکس پشتیبانی نمی‌شود'));
      img.onload=()=>{
        const max=1600;
        const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(f);
  });
}
async function generate(){try{let f=$('photo').files[0];if(!f)throw Error('عکس محصول را انتخاب کن');$('result').textContent='در حال تولید...';let j=await api('/generate',{method:'POST',body:JSON.stringify({token,image_data_url:await dataUrl(f),language:$('lang').value})});$('result').textContent='عنوان: '+j.title+'\\n\\nتوضیحات: '+j.description+'\\n\\nInstagram: '+j.instagram+'\\n\\nHashtags: '+j.hashtags;boot()}catch(e){$('result').textContent=e.message}}
async function order(){try{let j=await api('/orders',{method:'POST',body:JSON.stringify({token})});let qr='https://quickchart.io/qr?size=220&text='+encodeURIComponent('tron:'+j.address+'?token=USDT&amount='+j.amount_usdt);$('pay').innerHTML='<p>مبلغ: <b>'+j.amount_usdt+' USDT</b></p><p>شبکه: TRON / TRC20</p><p style="word-break:break-all">'+j.address+'</p><img class="qr" src="'+qr+'"><input id="tx" placeholder="TX Hash"><button onclick="verify(\''+j.order_id+'\')">بررسی پرداخت</button><div id="vmsg"></div>'}catch(e){$('pay').textContent=e.message}}
async function verify(id){try{let j=await api('/orders/verify',{method:'POST',body:JSON.stringify({token,order_id:id,tx_hash:$('tx').value})});$('vmsg').textContent='پرداخت تأیید شد ✅ Pro تا '+j.pro_until;boot()}catch(e){$('vmsg').textContent=e.message}}
boot();
</script></body></html>
